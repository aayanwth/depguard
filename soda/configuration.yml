data_source depguard_duckdb:
  type: duckdb
  path: "duckdb.duckdb"
  read_only: true
  schema: bronze

data_source depguard_duckdb_silver:
  type: duckdb
  path: "duckdb.duckdb"
  read_only: true
  schema: silver

data_source depguard_snowflake:
  type: snowflake
  username: ${SNOWFLAKE_USER}
  password: ${SNOWFLAKE_PASSWORD}
  account: ${SNOWFLAKE_ACCOUNT}
  database: ${SNOWFLAKE_DATABASE}
  warehouse: ${SNOWFLAKE_WAREHOUSE}
  role: ${SNOWFLAKE_ROLE}
  schema: bronze

data_source depguard_snowflake_silver:
  type: snowflake
  username: ${SNOWFLAKE_USER}
  password: ${SNOWFLAKE_PASSWORD}
  account: ${SNOWFLAKE_ACCOUNT}
  database: ${SNOWFLAKE_DATABASE}
  warehouse: ${SNOWFLAKE_WAREHOUSE}
  role: ${SNOWFLAKE_ROLE}
  schema: silver
